name: 🏆 prod — Playwright check → Deploy PROD → Tag

# Triggered when nowdev is merged/pushed into prod branch.
# Flow: nowdev → PR merge into prod → Playwright re-check → deploy to ServiceNow PROD → tag release
#
# IMPORTANT: The `production` environment requires a manual reviewer approval
# configured in GitHub → Settings → Environments → production
on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── STAGE 1: Re-run Playwright against DEV as final gate ────────────────────
  # We validate against DEV (already deployed) before touching PROD
  playwright-gate:
    name: 🎭 Playwright gate check → DEV
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Playwright tests against DEV (promotion gate)
        env:
          SN_DEV_INSTANCE: ${{ secrets.SN_DEV_INSTANCE }}
          SN_DEV_USER: ${{ secrets.SN_DEV_USER }}
          SN_DEV_PASS: ${{ secrets.SN_DEV_PASS }}
          CI: true
          HEADLESS: true
          TIMEOUT_SECONDS: 90
        run: npm run test

      - name: 📊 Upload gate Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-gate-report
          path: playwright-report/
          retention-days: 14

  # ─── STAGE 2: Build for PROD (on push only, not PR checks) ──────────────────
  build-prod:
    name: 🔨 Build for PROD
    runs-on: ubuntu-latest
    needs: playwright-gate
    environment: production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Fluent SDK Package
        run: npm run build

      - name: 💾 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-prod
          path: dist/
          retention-days: 1

  # ─── STAGE 3: Deploy to ServiceNow PROD (manual approval gate) ───────────────
  deploy-prod:
    name: 🏆 Deploy → ServiceNow PROD
    runs-on: ubuntu-latest
    needs: build-prod
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production   # ← manual reviewer approval in GitHub Settings → Environments

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 📂 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist-prod
          path: dist/

      - name: 🔑 Authenticate now-sdk → PROD
        run: |
          echo "${{ secrets.SN_PROD_PASS }}" | npx now-sdk auth \
            --add "${{ secrets.SN_PROD_INSTANCE }}" \
            --type basic \
            --alias prod \
            --username "${{ secrets.SN_PROD_USER }}" \
            --password-stdin

      - name: 🚀 Deploy to ServiceNow PROD
        run: npm run deploy -- --auth prod

      - name: 🏷️ Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "release-$(date +'%Y%m%d-%H%M%S')" -m "Production deployment — Playwright verified"
          git push origin --tags || echo "Tag push skipped (check GITHUB_TOKEN permissions)."
