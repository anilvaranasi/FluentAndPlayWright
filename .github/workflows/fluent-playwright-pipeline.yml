name: 🔀 PR Quality Gate (feature → nowdev)

# Lightweight PR check: typecheck + build only.
# Full deploy + Playwright runs automatically when you push to nowdev or prod.
#
# Branch strategy:
#   mydev (local)  →  push → nowdev  →  nowdev-pipeline.yml  (deploy DEV + Playwright)
#                                  ↓ PR merge
#                                prod  →  prod-pipeline.yml   (Playwright gate + deploy PROD)
#   (pull from SN) →  sn-pull-sync.yml  →  sn-sync branch    (fetch locally)

on:
  pull_request:
    branches: [ nowdev, prod, main ]

env:
  NODE_VERSION: '20'

jobs:
  pr-checks:
    name: 🛡️ Typecheck & Build (PR gate)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔍 Validate now.config.json
        run: |
          node -e "
            const cfg = require('./now.config.json');
            if (!cfg.scope || !cfg.scopeId || !cfg.name) {
              console.error('❌ Missing required metadata in now.config.json');
              process.exit(1);
            }
            console.log('✅ now.config.json:', cfg.name, '(' + cfg.scope + ')');
          "

      - name: 🔎 TypeScript Typecheck
        run: npm run typecheck

      - name: 🏗️ Fluent SDK Build
        run: npm run build
